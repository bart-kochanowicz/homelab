---
- name: Install Terraform archive, process locking, and state backup tools
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - unzip
      - util-linux
    state: present

- name: Create the Terraform operator group
  ansible.builtin.group:
    name: terraform-ops
    system: true

- name: Allow capcom to use the shared Terraform process lock
  ansible.builtin.user:
    name: capcom
    groups:
      - terraform-ops
    append: true

- name: Create Terraform installation directories on the SSD
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /srv/terraform/tools
    - /srv/terraform/tools/archives
    - "/srv/terraform/tools/terraform-{{ terraform_cli_version }}"

- name: Create the private operator workspace on the SSD
  ansible.builtin.file:
    path: /srv/terraform/workspaces
    state: directory
    owner: capcom
    group: capcom
    mode: '0700'

- name: Create shared state backup staging on the SSD
  ansible.builtin.file:
    path: /srv/terraform/backup-staging
    state: directory
    owner: root
    group: terraform-ops
    mode: '1770'

- name: Check the installed Terraform executable checksum
  ansible.builtin.stat:
    path: "/srv/terraform/tools/terraform-{{ terraform_cli_version }}/terraform"
    checksum_algorithm: sha256
  register: terraform_cli_binary

- name: Download the checksum-verified Terraform release archive
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_cli_version }}/terraform_{{ terraform_cli_version }}_linux_amd64.zip"
    dest: "/srv/terraform/tools/archives/terraform_{{ terraform_cli_version }}_linux_amd64.zip"
    checksum: "sha256:{{ terraform_cli_archive_sha256 }}"
    owner: root
    group: root
    mode: '0644'
  when: terraform_cli_binary.stat.checksum | default('') != terraform_cli_binary_sha256

- name: Remove an executable whose checksum differs from the pinned release
  ansible.builtin.file:
    path: "/srv/terraform/tools/terraform-{{ terraform_cli_version }}/terraform"
    state: absent
  when:
    - terraform_cli_binary.stat.exists
    - terraform_cli_binary.stat.checksum | default('') != terraform_cli_binary_sha256
    - not ansible_check_mode

- name: Extract the Terraform executable from the verified archive
  ansible.builtin.unarchive:
    src: "/srv/terraform/tools/archives/terraform_{{ terraform_cli_version }}_linux_amd64.zip"
    dest: "/srv/terraform/tools/terraform-{{ terraform_cli_version }}"
    remote_src: true
    include:
      - terraform
    owner: root
    group: root
    mode: '0755'
  when:
    - terraform_cli_binary.stat.checksum | default('') != terraform_cli_binary_sha256
    - not ansible_check_mode

- name: Ensure Terraform executable permissions
  ansible.builtin.file:
    path: "/srv/terraform/tools/terraform-{{ terraform_cli_version }}/terraform"
    state: file
    owner: root
    group: root
    mode: '0755'
  when: terraform_cli_binary.stat.exists or not ansible_check_mode

- name: Create the protected runtime lock directory
  ansible.builtin.file:
    path: /run/houston-terraform
    state: directory
    owner: root
    group: terraform-ops
    mode: '0750'

- name: Create the shared lock file without replacing its inode
  ansible.builtin.file:
    path: /run/houston-terraform/operation.lock
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: root
    group: terraform-ops
    mode: '0660'

- name: Recreate the runtime lock directory and file at boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/houston-terraform.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      d /run/houston-terraform 0750 root terraform-ops -
      f /run/houston-terraform/operation.lock 0660 root terraform-ops -

- name: Install the Terraform command with the shared process lock
  ansible.builtin.template:
    src: terraform.sh.j2
    dest: /usr/local/bin/terraform
    owner: root
    group: root
    mode: '0755'
    follow: false
