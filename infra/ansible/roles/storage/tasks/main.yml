---
- name: Persist the verified SSD mount by UUID
  ansible.posix.mount:
    path: /srv/terraform
    src: "UUID={{ houston_ssd_uuid.stdout }}"
    fstype: ext4
    opts: defaults,noatime,nofail,x-systemd.device-timeout=10s
    dump: '0'
    passno: '2'
    state: present

- name: Enable scheduled SSD TRIM
  ansible.builtin.systemd_service:
    name: fstrim.timer
    enabled: true
    state: started

- name: Create the root-owned backup parent on the SSD
  ansible.builtin.file:
    path: /srv/terraform/backups
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the private Talos recovery repository directory
  ansible.builtin.file:
    path: /srv/terraform/backups/talos
    state: directory
    owner: capcom
    group: capcom
    mode: '0700'
