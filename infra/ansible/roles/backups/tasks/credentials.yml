---
- name: Read the private backup kubeconfig from the controller
  ansible.builtin.slurp:
    src: "{{ houston_backup_kubeconfig_source }}"
  delegate_to: localhost
  become: false
  register: houston_backup_kubeconfig_file
  no_log: true

- name: Parse the scoped backup kubeconfig
  ansible.builtin.set_fact:
    houston_backup_kubeconfig: "{{ houston_backup_kubeconfig_file.content | b64decode | from_yaml }}"
  no_log: true

- name: Require a single embedded client identity for the private Kubernetes API
  ansible.builtin.assert:
    that:
      - houston_backup_kubeconfig.apiVersion == 'v1'
      - houston_backup_kubeconfig.kind == 'Config'
      - houston_backup_kubeconfig.clusters | length == 1
      - houston_backup_kubeconfig.users | length == 1
      - houston_backup_kubeconfig.contexts | length == 1
      - houston_backup_kubeconfig.clusters[0].cluster.keys() | sort == ['certificate-authority-data', 'server']
      - houston_backup_kubeconfig.clusters[0].cluster.server == 'https://10.0.70.11:6443'
      - houston_backup_kubeconfig.users[0].name == 'houston-backup'
      - houston_backup_kubeconfig.users[0].user.keys() | sort == ['client-certificate-data', 'client-key-data']
      - houston_backup_kubeconfig.contexts[0].context.namespace == 'monitoring'
      - houston_backup_kubeconfig.contexts[0].context.cluster == houston_backup_kubeconfig.clusters[0].name
      - houston_backup_kubeconfig.contexts[0].context.user == 'houston-backup'
      - houston_backup_kubeconfig['current-context'] == houston_backup_kubeconfig.contexts[0].name
    fail_msg: Use only the embedded houston-backup client identity and the private API endpoint.
  no_log: true

- name: Create private temporary certificate storage on the controller
  ansible.builtin.tempfile:
    state: directory
    prefix: houston-backup-credentials-
  delegate_to: localhost
  become: false
  register: houston_backup_certificate_directory
  check_mode: false
  no_log: true

- name: Verify the backup identity, certificate validity and matching key
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: true
  block:
    - name: Decode the client certificate and trust chain into private temporary files
      ansible.builtin.copy:
        dest: "{{ houston_backup_certificate_directory.path }}/{{ item.name }}"
        content: "{{ item.content | b64decode }}"
        mode: '0600'
      loop:
        - name: ca.pem
          content: "{{ houston_backup_kubeconfig.clusters[0].cluster['certificate-authority-data'] }}"
        - name: client.pem
          content: "{{ houston_backup_kubeconfig.users[0].user['client-certificate-data'] }}"
        - name: client-key.pem
          content: "{{ houston_backup_kubeconfig.users[0].user['client-key-data'] }}"

    - name: Verify the certificate chain, client usage and validity dates
      ansible.builtin.command:
        argv:
          - openssl
          - verify
          - -purpose
          - sslclient
          - -CAfile
          - "{{ houston_backup_certificate_directory.path }}/ca.pem"
          - "{{ houston_backup_certificate_directory.path }}/client.pem"
      changed_when: false

    - name: Require more than one day of remaining certificate validity
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ houston_backup_certificate_directory.path }}/client.pem"
          - -noout
          - -checkend
          - '86400'
      changed_when: false

    - name: Read the certificate identity without accepting administrator groups
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ houston_backup_certificate_directory.path }}/client.pem"
          - -noout
          - -subject
          - -nameopt
          - RFC2253
      register: houston_backup_certificate_subject
      changed_when: false

    - name: Require the dedicated username and no organization or other subject fields
      ansible.builtin.assert:
        that: houston_backup_certificate_subject.stdout == 'subject=CN=houston-backup'
        fail_msg: The backup certificate must have only CN=houston-backup and no administrator groups.

    - name: Read the public key from the certificate
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ houston_backup_certificate_directory.path }}/client.pem"
          - -pubkey
          - -noout
      register: houston_backup_certificate_public_key
      changed_when: false

    - name: Read the public key from the private key
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ houston_backup_certificate_directory.path }}/client-key.pem"
          - -pubout
      register: houston_backup_private_public_key
      changed_when: false

    - name: Require a matching certificate and private key
      ansible.builtin.assert:
        that: houston_backup_certificate_public_key.stdout == houston_backup_private_public_key.stdout
        fail_msg: The backup certificate and private key do not match.
  always:
    - name: Remove private temporary certificate material from the controller
      ansible.builtin.file:
        path: "{{ houston_backup_certificate_directory.path }}"
        state: absent
