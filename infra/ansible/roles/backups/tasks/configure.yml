---
- name: Require the verified SSD and explicit private credential sources
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Debian'
      - ansible_distribution_major_version == '13'
      - ansible_architecture == 'x86_64'
      - houston_ssd_uuid.stdout | default('') | length > 0
      - houston_ssd_uuid.stdout == houston_mounted_uuid.stdout
      - >-
        ansible_mounts
        | selectattr('mount', 'equalto', '/srv/terraform')
        | selectattr('fstype', 'equalto', 'ext4')
        | list | length == 1
      - houston_backup_kubeconfig_source | length > 0
      - houston_backup_kubeconfig_source is match('^/')
      - houston_backup_password_source | length > 0
      - houston_backup_password_source is match('^/')
    fail_msg: >-
      Use the Houston playbook SSD preflight and explicitly supply absolute
      paths to the ignored, scoped backup kubeconfig and restic password file.

- name: Check private credential files on the Ansible controller
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ houston_backup_kubeconfig_source }}"
    - "{{ houston_backup_password_source }}"
  delegate_to: localhost
  become: false
  register: houston_backup_local_credentials
  no_log: true

- name: Require nonempty private credential files without symlinks
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not item.stat.islnk | default(false)
      - item.stat.size | default(0) > 0
      - item.stat.mode | default('') == '0600'
    fail_msg: Both credential sources must be regular, nonempty mode-0600 files.
  loop: "{{ houston_backup_local_credentials.results }}"
  no_log: true

- name: Validate the scoped client certificate before changing Houston
  ansible.builtin.import_tasks: credentials.yml

- name: Check whether the backup timer is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/homelab-backup.timer
  register: houston_backup_existing_timer

- name: Stop existing scheduling before updating backup tools and credentials
  ansible.builtin.systemd_service:
    name: homelab-backup.timer
    state: stopped
  when: houston_backup_existing_timer.stat.exists

- name: Check that no backup or recovery operation is running
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ item }}"
      - --property=ActiveState
      - --value
  loop:
    - homelab-backup.service
    - homelab-backup-recovery.service
  register: houston_backup_unit_states
  changed_when: false
  when: not ansible_check_mode

- name: Refuse to replace an active backup program or its credentials
  ansible.builtin.assert:
    that: item.stdout | trim in ['inactive', 'failed']
    fail_msg: Wait for the active backup or recovery operation before configuring backups.
  loop: "{{ houston_backup_unit_states.results }}"
  when: not ansible_check_mode

- name: Install backup and process locking tools
  ansible.builtin.apt:
    name:
      - restic
      - jq
      - ca-certificates
      - coreutils
      - util-linux
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Require restic support for checked command streaming
  ansible.builtin.command: restic backup --help
  register: houston_backup_restic_help
  changed_when: false
  when: not ansible_check_mode

- name: Verify the installed restic streaming interface
  ansible.builtin.assert:
    that: "'--stdin-from-command' in houston_backup_restic_help.stdout"
    fail_msg: restic must support --stdin-from-command to reject incomplete streams.
  when: not ansible_check_mode

- name: Create the dedicated backup group
  ansible.builtin.group:
    name: backup-svc
    system: true

- name: Create the dedicated backup account without runner privileges
  ansible.builtin.user:
    name: backup-svc
    group: backup-svc
    groups: []
    append: false
    system: true
    home: /srv/terraform/backups
    create_home: false
    shell: /usr/sbin/nologin
    password_lock: true

- name: Create private backup directories on the SSD
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: backup-svc
    group: backup-svc
    mode: '0700'
  loop:
    - /srv/terraform/backups
    - /srv/terraform/backups/homelab-restic
    - /srv/terraform/backups/state
    - /srv/terraform/backups/cache
    - /srv/terraform/backups/tmp

- name: Create the protected backup configuration directory
  ansible.builtin.file:
    path: /etc/homelab-backup
    state: directory
    owner: root
    group: backup-svc
    mode: '0750'

- name: Stage the candidate restic password without replacing working credentials
  ansible.builtin.copy:
    src: "{{ houston_backup_password_source }}"
    dest: /etc/homelab-backup/restic-password.candidate
    owner: backup-svc
    group: backup-svc
    mode: '0600'
  no_log: true

- name: Check whether the restic repository already exists
  ansible.builtin.stat:
    path: /srv/terraform/backups/homelab-restic/config
  register: houston_backup_repository_config

- name: Check whether an uninitialized repository directory is empty
  ansible.builtin.find:
    paths: /srv/terraform/backups/homelab-restic
    hidden: true
    recurse: false
    file_type: any
  register: houston_backup_repository_contents
  when: not houston_backup_repository_config.stat.exists

- name: Refuse initialization over incomplete or unexpected repository files
  ansible.builtin.assert:
    that: houston_backup_repository_contents.matched == 0
    fail_msg: Repository config is missing but the directory is not empty; inspect it manually.
  when: not houston_backup_repository_config.stat.exists

- name: Initialize only a new empty encrypted repository
  ansible.builtin.command: restic init
  become_user: backup-svc
  environment:
    RESTIC_REPOSITORY: /srv/terraform/backups/homelab-restic
    RESTIC_PASSWORD_FILE: /etc/homelab-backup/restic-password.candidate
    RESTIC_CACHE_DIR: /srv/terraform/backups/cache
  when:
    - not houston_backup_repository_config.stat.exists
    - not ansible_check_mode
  changed_when: true
  no_log: true

- name: Verify that the supplied password opens the repository
  ansible.builtin.command: restic cat config
  become_user: backup-svc
  environment:
    RESTIC_REPOSITORY: /srv/terraform/backups/homelab-restic
    RESTIC_PASSWORD_FILE: /etc/homelab-backup/restic-password.candidate
    RESTIC_CACHE_DIR: /srv/terraform/backups/cache
  changed_when: false
  when: not ansible_check_mode
  no_log: true

- name: Install the verified restic password and scoped kubeconfig
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: backup-svc
    group: backup-svc
    mode: '0600'
  loop:
    - src: "{{ houston_backup_password_source }}"
      dest: /etc/homelab-backup/restic-password
    - src: "{{ houston_backup_kubeconfig_source }}"
      dest: /etc/homelab-backup/kubeconfig
  no_log: true

- name: Remove the temporary password candidate after verification
  ansible.builtin.file:
    path: /etc/homelab-backup/restic-password.candidate
    state: absent
  no_log: true

- name: Create the root-owned executable directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the pinned checksum-verified Kubernetes client
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ houston_backup_kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/libexec/homelab-kubectl
    checksum: "sha256:{{ houston_backup_kubectl_sha256 }}"
    owner: root
    group: root
    mode: '0755'

- name: Link the pinned Kubernetes client to the standard command path
  ansible.builtin.file:
    src: /usr/local/libexec/homelab-kubectl
    dest: /usr/local/bin/kubectl
    owner: root
    group: root
    state: link

- name: Install the root-owned backup program
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../scripts/backup-pvcs.sh"
    dest: /usr/local/libexec/homelab-backup
    owner: root
    group: root
    mode: '0755'

- name: Install the backup environment and retention settings
  ansible.builtin.template:
    src: backup.env.j2
    dest: /etc/homelab-backup/environment
    owner: root
    group: backup-svc
    mode: '0640'

- name: Install the backup and recovery units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - homelab-backup.service
    - homelab-backup-recovery.service
    - homelab-backup.timer
  notify: Reload backup systemd units

- name: Reload changed backup units before enabling recovery
  ansible.builtin.meta: flush_handlers

- name: Enable recovery at boot and recover any interrupted operation
  ansible.builtin.systemd_service:
    name: homelab-backup-recovery.service
    daemon_reload: true
    enabled: true
    state: started

- name: Keep scheduled interruptions disabled until the first backup is accepted
  ansible.builtin.systemd_service:
    name: homelab-backup.timer
    enabled: "{{ houston_backup_timer_enabled | bool }}"
    state: "{{ 'started' if houston_backup_timer_enabled | bool else 'stopped' }}"
