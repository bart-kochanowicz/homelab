---
- name: Reload Talos backup units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart Talos backup timer
  ansible.builtin.systemd_service:
    name: talos-etcd-backup.timer
    daemon_reload: true
    state: restarted
  when: not ansible_check_mode
