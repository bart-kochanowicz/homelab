name: Dispatch Cloudflare apply

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.repository == 'bart-kochanowicz/homelab' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'bart-kochanowicz/homelab' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Cloudflare apply for the validated commit
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          VALIDATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || {
            printf '%s\n' 'Set the AUTOMATION_DISPATCH_TOKEN repository secret.' >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VALIDATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          python3 - <<'PYTHON' | gh api --method POST \
            repos/bart-kochanowicz/homelab-automation/actions/workflows/terraform.yaml/dispatches \
            --input -
          import json
          import os
          print(json.dumps({"ref": "main", "inputs": {
              "terraform_root": "cloudflare",
              "operation": "apply",
              "source_sha": os.environ["SOURCE_SHA"],
              "validation_run_id": os.environ["VALIDATION_RUN_ID"],
          }}))
          PYTHON
