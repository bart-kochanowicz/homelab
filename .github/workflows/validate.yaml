name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5e # v4
        with:
          fetch-depth: 0

      - name: Restore Aqua tools
        id: aqua-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: aqua-v1-${{ runner.os }}-${{ runner.arch }}-2.66.1-validate-${{ hashFiles('aqua.yaml', '.github/workflows/validate.yaml') }}

      - name: Install Aqua
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1
          skip_install_aqua: ${{ steps.aqua-cache.outputs.cache-hit == 'true' }}
          enable_aqua_install: 'false'

      - name: Install validation tools
        env:
          AQUA_MAX_PARALLELISM: '16'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          aqua i -- uv terraform kubectl helm kustomize shellcheck kubeconform kube-linter trivy gitleaks restic jq yq amtool promtool &
          aqua_pid=$!
          # Only Aqua needs the token to verify downloaded packages.
          unset GITHUB_TOKEN
          pipx install yamllint==1.37.1 &
          yamllint_pid=$!
          (sudo apt-get update && sudo apt-get install -y sqlite3) &
          sqlite_pid=$!
          failed=0
          for installer_pid in "$aqua_pid" "$yamllint_pid" "$sqlite_pid"; do
            if ! wait "$installer_pid"; then failed=1; fi
          done
          exit "$failed"

      - name: Save Aqua tools
        if: steps.aqua-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: ${{ steps.aqua-cache.outputs.cache-primary-key }}

      - name: Validate repository
        run: make validate

      - name: Upload dependency vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-scan
          path: .cache/dependency-scan/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
