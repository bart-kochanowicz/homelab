name: Image Scan

on:
  pull_request:
    paths:
      - apps/**
      - system/**
      - Makefile
      - aqua.yaml
      - .github/workflows/image-scan.yaml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5e # v4

      - name: Install validation tools
        uses: aquaproj/aqua-installer@097ac59b80cea8bd5afb5d01f5310d26db620742 # v4.0.3
        with:
          aqua_version: v2.55.0

      - name: Scan rendered application and platform images
        run: make scan-images

      - name: Upload image inventory and vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-scan
          path: |
            .cache/image-scan/images.txt
            .cache/image-scan/reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
