name: Image Scan

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5e # v4

      - name: Install validation tools
        uses: aquaproj/aqua-installer@097ac59b80cea8bd5afb5d01f5310d26db620742 # v4.0.3
        with:
          aqua_version: v2.55.0

      - name: Scan deployed application images
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(
            rg --no-filename '^[[:space:]]*image:' apps system \
              -g '*.yaml' -g '!**/charts/**' |
              awk '{print $2}' | sort -u
          )
          failed=0
          for image in "${images[@]}"; do
            if ! aqua exec -- trivy image \
              --exit-code 1 \
              --ignore-unfixed \
              --severity CRITICAL \
              --scanners vuln \
              "$image"; then
              failed=1
            fi
          done
          exit "$failed"
