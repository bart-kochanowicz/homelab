name: Image Scan

on:
  pull_request:
    paths:
      - apps/**
      - system/**
      - Makefile
      - aqua.yaml
      - .trivy-images.yaml
      - .github/workflows/image-scan.yaml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5e # v4

      - name: Restore Aqua tools
        id: aqua-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: aqua-v1-${{ runner.os }}-${{ runner.arch }}-2.66.1-images-${{ hashFiles('aqua.yaml', '.github/workflows/image-scan.yaml') }}

      - name: Install validation tools
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1
          skip_install_aqua: ${{ steps.aqua-cache.outputs.cache-hit == 'true' }}
          packages: helm kustomize trivy yq

      - name: Save Aqua tools
        if: steps.aqua-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: ${{ steps.aqua-cache.outputs.cache-primary-key }}

      - name: Scan rendered application and platform images
        run: make scan-images

      - name: Upload image inventory and vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-scan
          path: |
            .cache/image-scan/images.txt
            .cache/image-scan/reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
