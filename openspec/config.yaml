schema: spec-driven

# Constraints for OpenSpec artifacts. AGENTS.md holds repository conventions.
context: |
  The repository declares the desired state of a private homelab. A change is
  deployed by ArgoCD from main, by Terraform after a reviewed plan, or by an
  operator running a documented bootstrap or Ansible command.
  Specs state what the homelab guarantees, not how a rollout happened.

rules:
  proposal:
    - State the blast radius and whether the change is reversible.
    - Name every deployment path the change needs and any manual sync,
      bootstrap, Terraform apply or Ansible run.
  design:
    - Cover failure recovery, backups and data loss for stateful changes.
  specs:
    - Write requirements as guarantees a test, command or review can check.
  tasks:
    - End with validation, documentation updates and archiving the change.
    - Mark steps that change live infrastructure; they need user approval.

operations:
  apply:
    guidance:
      - Run focused checks after each task and make validate before finishing.
  archive:
    guidance:
      - Archive before merge; the archive folder is not tracked.
