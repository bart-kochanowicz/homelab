apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crafty-backend
  namespace: crafty-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: crafty-controller
    app.kubernetes.io/part-of: homelab
spec:
  secretName: crafty-backend-tls
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "*.thecavespace.net"
  renewBeforePercentage: 33
  revisionHistoryLimit: 2
  usages:
    - digital signature
    - server auth
