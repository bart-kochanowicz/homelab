apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: crafty-controller
  namespace: crafty-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: crafty-controller
    app.kubernetes.io/part-of: homelab
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: crafty-controller
      sectionName: web
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: crafty-backend-ca
    hostname: crafty-controller.crafty-controller.svc.cluster.local
