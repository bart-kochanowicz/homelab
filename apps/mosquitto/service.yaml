apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: homelab
  annotations:
    metallb.io/address-pool: mosquitto
    metallb.io/loadBalancerIPs: 10.0.70.202
spec:
  type: LoadBalancer
  loadBalancerClass: metallb.io/metallb
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  # The camera in IoT and Home Assistant, which runs on the worker's host network.
  loadBalancerSourceRanges:
    - 10.0.50.190/32
    - 10.0.70.12/32
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
  - name: mqtt
    port: 1883
    targetPort: mqtt
    protocol: TCP
  - name: wake
    port: 7967
    targetPort: wake
    protocol: TCP
