apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/part-of: homelab
      annotations:
        homelab.security/automount-reviewed: "true"
    spec:
      serviceAccountName: mosquitto
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Mosquitto refuses symlinked files, which Secret and ConfigMap volumes always
      # contain, so the credentials are copied to memory-backed storage it owns.
      initContainers:
      - name: prepare-credentials
        image: docker.io/library/eclipse-mosquitto:2.1.4-alpine@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -ec
          - |
            cp /mosquitto/secret/passwd /mosquitto/config/acl /mosquitto/runtime/
            chmod 0400 /mosquitto/runtime/passwd /mosquitto/runtime/acl
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config
          readOnly: true
        - name: secret
          mountPath: /mosquitto/secret
          readOnly: true
        - name: runtime
          mountPath: /mosquitto/runtime
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 16Mi
      containers:
      - name: mosquitto
        image: docker.io/library/eclipse-mosquitto:2.1.4-alpine@sha256:fa12172a051310efe5bcb7a6a11b77bd5faacb82cbacd7742aa758bf024fd8e4
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - name: mqtt
          containerPort: 1883
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config
          readOnly: true
        - name: runtime
          mountPath: /mosquitto/runtime
          readOnly: true
        startupProbe:
          tcpSocket:
            port: mqtt
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          tcpSocket:
            port: mqtt
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: mqtt
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
      # Holds the connection that the camera's Wi-Fi coprocessor keeps while the camera
      # sleeps, and wakes the camera on request (open-doorview, docs/remote-wake.md).
      - name: doorview-wake
        image: docker.io/library/python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
        imagePullPolicy: IfNotPresent
        command: ["python3", "-I", "-B", "/wake/doorview-wake.py"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - name: wake
          containerPort: 7967
          protocol: TCP
        volumeMounts:
        - name: wake
          mountPath: /wake
          readOnly: true
        - name: wake-secret
          mountPath: /wake-secret
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: wake
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 48Mi
      volumes:
      - name: config
        configMap:
          name: mosquitto-config
          defaultMode: 0440
      - name: wake
        configMap:
          name: mosquitto-config
          defaultMode: 0440
          items:
          - key: doorview-wake.py
            path: doorview-wake.py
      - name: wake-secret
        secret:
          secretName: mosquitto-secret
          defaultMode: 0440
          items:
          - key: wake-pattern
            path: wake-pattern
      - name: secret
        secret:
          secretName: mosquitto-secret
          defaultMode: 0440
      - name: runtime
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
