apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  annotations:
    secret.reloader.stakater.com/reload: home-assistant-backend-tls
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
      annotations:
        homelab.security/automount-reviewed: "true"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: home-assistant
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: initialize-config
        image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
        command:
        - cp
        - -n
        - /defaults/automations.yaml
        - /defaults/scripts.yaml
        - /defaults/scenes.yaml
        - /config/
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 16Mi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config-file
          mountPath: /defaults
          readOnly: true
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - name: https
          containerPort: 8123
          protocol: TCP
        env:
        - name: TZ
          value: "Europe/Warsaw"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config-file
          mountPath: /config/configuration.yaml
          subPath: configuration.yaml
        - name: backend-tls
          mountPath: /etc/home-assistant/tls
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: https
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: 2000m
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: home-assistant-data-nvme
      - name: config-file
        configMap:
          name: home-assistant-config
      - name: backend-tls
        secret:
          secretName: home-assistant-backend-tls
          defaultMode: 0400
