# Front door camera: the snapshot image, its notification, archive and retention,
# and the events dashboard. Loaded as a Home Assistant package, so each key below
# is merged into the configuration.

# The card that lists the front-door snapshots. /local serves /config/www without
# authentication, so that directory holds only this script (a read-only mount of
# the front-door-card ConfigMap) and never a picture. The version in the URL is
# the start of the file's SHA-256, so a change to the card busts the browser's
# month-long cache for /local.
frontend:
  extra_module_url:
    - /local/front-door/front-door-events-card.js?v=c311dbc21af5a774

# The default dashboard stays in the UI. This one is read from the repository
# and listed in the sidebar for every user.
lovelace:
  dashboards:
    front-door:
      mode: yaml
      title: Front door
      icon: mdi:doorbell-video
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/front-door.yaml

# The camera publishes a JPEG after motion, and, while the live view is on, a frame
# up to twice a second. The broker connection itself is added in the UI; entities
# declared here attach to it. Nothing here reaches the camera: Home Assistant only
# talks to the broker.
mqtt:
  image:
    - name: Front door camera snapshot
      unique_id: front_door_camera_snapshot
      image_topic: doorview/front-door-camera/snapshot
      content_type: image/jpeg
      encoding: ""
    # The live frames. Not the snapshot entity, which the notification and the
    # archive follow, so a frame never counts as a motion picture.
    - name: Front door live
      unique_id: front_door_live
      image_topic: doorview/front-door-camera/live
      content_type: image/jpeg
      encoding: ""
  binary_sensor:
    # Whether the camera is connected to the broker, from the availability topic that
    # its last will sets to offline. The live entities carry no `availability` of their
    # own: Home Assistant 2026.10 left YAML entities that had one unavailable after a
    # restart until the camera published again (the message is retained, so it never
    # does), whereas a state topic is read correctly at start.
    - name: Front door camera online
      unique_id: front_door_camera_online
      state_topic: doorview/front-door-camera/availability
      payload_on: online
      payload_off: offline
      device_class: connectivity
  switch:
    # ON asks the camera for about 30 seconds of frames and ON again renews them; the
    # camera ends the view by itself and reports it on the state topic (retained).
    # The command is neither retained nor optimistic: the switch shows what the
    # camera reports, so it stays off when the camera does not answer.
    - name: Front door live view
      unique_id: front_door_live_view
      command_topic: doorview/front-door-camera/live/set
      state_topic: doorview/front-door-camera/live/state
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      optimistic: false
      retain: false
      qos: 0

# The live frames would write a state row up to twice a second (the state of an image
# entity is the time it was updated); the bytes are never stored, only this.
recorder:
  exclude:
    entities:
      - image.front_door_live

# Deletes archived snapshots older than the retention in days; see front_door_snapshot_retention.
# The directory is fixed, find stays inside it (-maxdepth 1, regular files only, no
# symlinks) and a missing directory is not an error.
shell_command:
  front_door_snapshot_cleanup: >-
    retention_days=90;
    archive=/config/media/front-door;
    [ ! -d "$archive" ] ||
    find "$archive" -maxdepth 1 -type f -name '????-??-??_??-??-??.jpg'
    -mmin +$((retention_days * 1440)) -delete

automation front_door:
  - id: front_door_motion_notification
    alias: Front door motion notification
    description: Sends a phone notification with the camera snapshot when it reports motion.
    # Further motion is dropped while a run waits for the image or the cooldown.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_camera_motion
        from: "off"
        to: "on"
    variables:
      motion_at: "{{ as_timestamp(trigger.to_state.last_changed) }}"
      snapshot_is_new: >-
        {{ states('image.front_door_camera_snapshot') not in ['unavailable', 'unknown']
           and as_timestamp(states.image.front_door_camera_snapshot.last_updated) >= motion_at - 5 }}
    actions:
      # The image may arrive before or after the motion state; wait only if it has not.
      - if: "{{ not snapshot_is_new }}"
        then:
          - wait_for_trigger:
              # `to: null` ignores attribute changes, such as the access token that
              # the image entity rotates every five minutes.
              - trigger: state
                entity_id: image.front_door_camera_snapshot
                to: null
            timeout: "00:00:20"
            continue_on_timeout: true
      - variables:
          snapshot_is_new: >-
            {{ states('image.front_door_camera_snapshot') not in ['unavailable', 'unknown']
               and as_timestamp(states.image.front_door_camera_snapshot.last_updated) >= motion_at - 5 }}
      - choose:
          - conditions: "{{ snapshot_is_new }}"
            sequence:
              - action: notify.mobile_app_iphone_bart
                data:
                  title: Front door
                  message: Motion detected at the front door.
                  data:
                    # Tapping the notification opens the events dashboard: `url` is read
                    # by iOS and `clickAction` by Android.
                    url: /front-door/events
                    clickAction: /front-door/events
                    image: /api/image_proxy/image.front_door_camera_snapshot
                    attachment:
                      url: /api/image_proxy/image.front_door_camera_snapshot
        default:
          - action: notify.mobile_app_iphone_bart
            data:
              title: Front door
              message: Motion detected, but no snapshot arrived.
              data:
                url: /front-door/events
                clickAction: /front-door/events
      - delay: "00:01:00"
  - id: front_door_snapshot_archive
    alias: Front door snapshot archive
    description: Saves the snapshot that follows each motion as a timestamped JPEG in the Media browser.
    # The camera publishes its snapshots with the MQTT retain flag, so Home Assistant
    # receives the last picture again after every restart or broker reconnect, which
    # looks like a new image. A replay is not preceded by Motion turning on (a start
    # or reconnect goes unavailable -> state, never off -> on), so only a picture
    # that follows a real motion is saved, with the same freshness rule as the
    # notification. This is a separate automation, so a failed write is only logged
    # and never delays or suppresses the notification; motion during a wait queues.
    mode: queued
    max: 5
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_camera_motion
        from: "off"
        to: "on"
    variables:
      motion_at: "{{ as_timestamp(trigger.to_state.last_changed) }}"
      snapshot_is_new: >-
        {{ states('image.front_door_camera_snapshot') not in ['unavailable', 'unknown']
           and as_timestamp(states.image.front_door_camera_snapshot.last_updated) >= motion_at - 5 }}
    actions:
      - if: "{{ not snapshot_is_new }}"
        then:
          - wait_for_trigger:
              # `to: null` ignores attribute changes, such as the access token that
              # the image entity rotates every five minutes.
              - trigger: state
                entity_id: image.front_door_camera_snapshot
                to: null
            timeout: "00:00:20"
            continue_on_timeout: true
      - variables:
          snapshot_is_new: >-
            {{ states('image.front_door_camera_snapshot') not in ['unavailable', 'unknown']
               and as_timestamp(states.image.front_door_camera_snapshot.last_updated) >= motion_at - 5 }}
      - if: "{{ snapshot_is_new }}"
        then:
          # The state is the time the image arrived, so the name identifies the
          # picture: saving the same one twice rewrites one file.
          - action: image.snapshot
            target:
              entity_id: image.front_door_camera_snapshot
            data:
              filename: >-
                /config/media/front-door/{{ as_timestamp(states('image.front_door_camera_snapshot'))
                | timestamp_custom('%Y-%m-%d_%H-%M-%S') }}.jpg
  - id: front_door_snapshot_retention
    alias: Front door snapshot retention
    description: Deletes archived snapshots older than the retention.
    mode: single
    triggers:
      - trigger: time
        at: "04:15:00"
      - trigger: homeassistant
        event: start
    actions:
      - action: shell_command.front_door_snapshot_cleanup
