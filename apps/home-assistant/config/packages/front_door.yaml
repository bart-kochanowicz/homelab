# Front door camera: the snapshot image, its notification, archive and retention,
# and the "Door events" panel. Loaded as a Home Assistant package, so each key below
# is merged into the configuration.

# The card that lists the front-door snapshots, as a sidebar panel. /local serves
# /config/www without authentication, so that directory holds only this script (a
# read-only mount of the front-door-card ConfigMap) and never a picture. The version
# in the URL is the start of the file's SHA-256, so a change to the card busts the
# browser's month-long cache for /local.
#
# It is a panel and not a card on a dashboard because Home Assistant loads the module
# of a custom panel before it creates the element. On a dashboard the card was not yet
# defined when a full reload of the phone app drew it, which showed "Configuration
# error", also when it was a Lovelace resource.
panel_custom:
  - name: front-door-events-card
    sidebar_title: Door events
    sidebar_icon: mdi:image-multiple
    url_path: front-door-gallery
    require_admin: false
    module_url: /local/front-door/front-door-events-card.js?v=8a423f37cc381c5e
    config:
      page_size: 30
      sources:
        - label: Motion
          icon: mdi:motion-sensor
          media_content_id: media-source://media_source/front_door
      # The Live tab: the switch that starts and stops the view, the frames, and the
      # camera's availability.
      live:
        switch: switch.front_door_live_view
        image: image.front_door_live
        online: binary_sensor.front_door_camera_online

# The camera publishes a JPEG after motion, and, while the live view is on, a frame
# up to twice a second. The broker connection itself is added in the UI; entities
# declared here attach to it. Nothing here reaches the camera: Home Assistant only
# talks to the broker.
mqtt:
  image:
    - name: Front door camera snapshot
      unique_id: front_door_camera_snapshot
      image_topic: doorview/front-door-camera/snapshot
      content_type: image/jpeg
      encoding: ""
    # The live frames. Not the snapshot entity, which the notification and the
    # archive follow, so a frame never counts as a motion picture.
    - name: Front door live
      unique_id: front_door_live
      image_topic: doorview/front-door-camera/live
      content_type: image/jpeg
      encoding: ""
  binary_sensor:
    # Whether the camera is connected to the broker, from the availability topic that
    # its last will sets to offline. The live entities carry no `availability` of their
    # own: Home Assistant 2026.10 left YAML entities that had one unavailable after a
    # restart until the camera published again (the message is retained, so it never
    # does), whereas a state topic is read correctly at start.
    - name: Front door camera online
      unique_id: front_door_camera_online
      state_topic: doorview/front-door-camera/availability
      payload_on: online
      payload_off: offline
      device_class: connectivity
    # ON for a minute after the detector finds a person in the snapshot of a motion
    # event. Home Assistant publishes it itself (see front_door_person_detection).
    - name: Front door person
      unique_id: front_door_person
      state_topic: doorview/front-door-camera/person
      payload_on: "ON"
      payload_off: "OFF"
      off_delay: 60
  switch:
    # ON asks the camera for about 30 seconds of frames and ON again renews them; the
    # camera ends the view by itself and reports it on the state topic (retained).
    # The command is neither retained nor optimistic: the switch shows what the
    # camera reports, so it stays off when the camera does not answer.
    - name: Front door live view
      unique_id: front_door_live_view
      command_topic: doorview/front-door-camera/live/set
      state_topic: doorview/front-door-camera/live/state
      payload_on: "ON"
      payload_off: "OFF"
      state_on: "ON"
      state_off: "OFF"
      optimistic: false
      retain: false
      qos: 0

# The live frames would write a state row up to twice a second (the state of an image
# entity is the time it was updated); the bytes are never stored, only this.
recorder:
  exclude:
    entities:
      - image.front_door_live

# Deletes archived snapshots older than the retention in days; see front_door_snapshot_retention.
# The directory is fixed, find stays inside it (-maxdepth 1, regular files only, no
# symlinks) and a missing directory is not an error.
shell_command:
  front_door_snapshot_cleanup: >-
    retention_days=90;
    archive=/config/media/front-door;
    [ ! -d "$archive" ] ||
    find "$archive" -maxdepth 1 -type f -name '????-??-??_??-??-??.jpg'
    -mmin +$((retention_days * 1440)) -delete

  # Sends an archived snapshot to the person detector that runs beside Home Assistant (the person-detector
  # container in the same pod, loopback only) and prints its JSON. Home Assistant runs a command that has a
  # template without a shell (no pipe, no quotes, no `case`), so it only starts the script, which accepts nothing
  # but an archive file name, waits for the file and answers with the detector's own JSON; a failure is a non-zero
  # return code or an answer without `detections`.
  front_door_person_detect: sh /config/bin/front-door-person-detect.sh {{ file }}

automation front_door:
  - id: front_door_camera_battery_low
    alias: Front door camera battery low
    description: Tells the phone once when the camera's battery stays below 20 percent for ten minutes.
    # numeric_state fires when the value crosses the limit, not on every update below it
    # and not while the sensor is unavailable, so one message per drop.
    # The MCU derives the percentage from the battery voltage, which sags under load:
    # on 2026-11-22 it read 13 for one minute with the screen on and 51 again after it.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.front_door_camera_battery
        below: 20
        for: "00:10:00"
    actions:
      - action: notify.mobile_app_iphone_bart
        data:
          title: Front door camera
          message: >-
            Battery is at {{ states('sensor.front_door_camera_battery') | int(0) }} %.
            {{ 'It is on USB power.' if is_state('binary_sensor.front_door_camera_external_power', 'on')
               else 'It is running on the battery.' }}

  - id: front_door_snapshot_archive
    alias: Front door snapshot archive
    description: Saves the snapshot that follows each motion as a timestamped JPEG in the Media browser.
    # The camera publishes its snapshots with the MQTT retain flag, so Home Assistant
    # receives the last picture again after every restart or broker reconnect, which
    # looks like a new image. A replay is not preceded by Motion turning on (a start
    # or reconnect goes unavailable -> state, never off -> on), so only a picture
    # that follows a real motion is saved, with the same freshness rule as the
    # notification. This is a separate automation, so a failed write is only logged
    # and never delays or suppresses the notification; motion during a wait queues.
    mode: queued
    max: 5
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_camera_motion
        from: "off"
        to: "on"
    variables:
      motion_at: "{{ as_timestamp(trigger.to_state.last_changed) }}"
      snapshot_is_new: >-
        {{ states('image.front_door_camera_snapshot') not in ['unavailable', 'unknown']
           and as_timestamp(states.image.front_door_camera_snapshot.last_updated) >= motion_at - 5 }}
    actions:
      - if: "{{ not snapshot_is_new }}"
        then:
          - wait_for_trigger:
              # `to: null` ignores attribute changes, such as the access token that
              # the image entity rotates every five minutes.
              - trigger: state
                entity_id: image.front_door_camera_snapshot
                to: null
            timeout: "00:00:20"
            continue_on_timeout: true
      - variables:
          snapshot_is_new: >-
            {{ states('image.front_door_camera_snapshot') not in ['unavailable', 'unknown']
               and as_timestamp(states.image.front_door_camera_snapshot.last_updated) >= motion_at - 5 }}
      - if: "{{ snapshot_is_new }}"
        then:
          # The state is the time the image arrived, so the name identifies the
          # picture: saving the same one twice rewrites one file.
          - action: image.snapshot
            target:
              entity_id: image.front_door_camera_snapshot
            data:
              filename: >-
                /config/media/front-door/{{ as_timestamp(states('image.front_door_camera_snapshot'))
                | timestamp_custom('%Y-%m-%d_%H-%M-%S') }}.jpg
  - id: front_door_person_detection
    alias: Front door person alert
    description: >-
      The only phone notification about the door. When the camera reports motion (its PIR),
      the snapshot is checked for a person: a person turns the person sensor on and sends
      a notification with the picture, no person sends nothing (the picture is still
      archived). If the check cannot be made, or no picture arrives, it says so instead of
      staying silent.
    # Its own automation, like the archive, so a slow or failed check never delays the
    # archive. Motion during a run queues.
    mode: queued
    max: 5
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.front_door_camera_motion
        from: "off"
        to: "on"
    variables:
      motion_at: "{{ as_timestamp(trigger.to_state.last_changed) }}"
      snapshot_is_new: >-
        {{ states('image.front_door_camera_snapshot') not in ['unavailable', 'unknown']
           and as_timestamp(states.image.front_door_camera_snapshot.last_updated) >= motion_at - 5 }}
    actions:
      # The image may arrive before or after the motion state; wait only if it has not.
      - if: "{{ not snapshot_is_new }}"
        then:
          - wait_for_trigger:
              # `to: null` ignores attribute changes, such as the access token that
              # the image entity rotates every five minutes.
              - trigger: state
                entity_id: image.front_door_camera_snapshot
                to: null
            timeout: "00:00:20"
            continue_on_timeout: true
      - variables:
          snapshot_is_new: >-
            {{ states('image.front_door_camera_snapshot') not in ['unavailable', 'unknown']
               and as_timestamp(states.image.front_door_camera_snapshot.last_updated) >= motion_at - 5 }}
      - choose:
          - conditions: "{{ snapshot_is_new }}"
            sequence:
              # The archive automation names the file after the image state, so this is
              # the same file; the script waits up to ten seconds for it.
              - action: shell_command.front_door_person_detect
                data:
                  file: >-
                    /config/media/front-door/{{ as_timestamp(states('image.front_door_camera_snapshot'))
                    | timestamp_custom('%Y-%m-%d_%H-%M-%S') }}.jpg
                response_variable: detection
                continue_on_error: true
              - variables:
                  answer: >-
                    {{ detection.stdout | from_json(default={}) if detection is defined else {} }}
                  checked: "{{ 'detections' in answer }}"
                  person_found: >-
                    {{ answer.get('detections', []) | selectattr('label', 'eq', 'person') | list | count > 0 }}
              - choose:
                  - conditions: "{{ person_found }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: doorview/front-door-camera/person
                          payload: "ON"
                      - action: notify.mobile_app_iphone_bart
                        data:
                          title: Front door
                          message: Person at the front door.
                          data:
                            tag: front-door-person
                            # Tapping the notification opens the events panel: `url` is
                            # read by iOS and `clickAction` by Android.
                            url: /front-door-gallery
                            clickAction: /front-door-gallery
                            image: /api/image_proxy/image.front_door_camera_snapshot
                            attachment:
                              url: /api/image_proxy/image.front_door_camera_snapshot
                  # No person and a working check: nothing to say. A check that did not
                  # work is reported, with the picture, so a person is not missed.
                  - conditions: "{{ not checked }}"
                    sequence:
                      - action: notify.mobile_app_iphone_bart
                        data:
                          title: Front door
                          message: Motion at the front door; the person check did not answer.
                          data:
                            tag: front-door-person
                            url: /front-door-gallery
                            clickAction: /front-door-gallery
                            image: /api/image_proxy/image.front_door_camera_snapshot
                            attachment:
                              url: /api/image_proxy/image.front_door_camera_snapshot
          # No new picture is expected when the camera took one a moment ago: it takes at
          # most one picture per 30 seconds, but the PIR reports every movement. Only a
          # picture that is missing although the last one is older than that is a fault.
          - conditions: >-
              {{ states('image.front_door_camera_snapshot') in ['unavailable', 'unknown']
                 or motion_at - as_timestamp(states('image.front_door_camera_snapshot')) > 35 }}
            sequence:
              - action: notify.mobile_app_iphone_bart
                data:
                  title: Front door
                  message: Motion detected, but no snapshot arrived.
                  data:
                    url: /front-door-gallery
                    clickAction: /front-door-gallery
  - id: front_door_snapshot_retention
    alias: Front door snapshot retention
    description: Deletes archived snapshots older than the retention.
    mode: single
    triggers:
      - trigger: time
        at: "04:15:00"
      - trigger: homeassistant
        event: start
    actions:
      - action: shell_command.front_door_snapshot_cleanup
