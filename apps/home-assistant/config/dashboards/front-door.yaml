title: Front door
views:
  # Only Home Assistant's own cards: this view is the one a notification opens, and
  # it must work in the phone app. The Gallery view below needs a custom card, which
  # the app did not have defined after a full reload ("Configuration error").
  - title: Events
    path: events
    icon: mdi:doorbell-video
    cards:
      - type: picture-entity
        entity: image.front_door_camera_snapshot
        name: Latest motion picture
        show_name: true
        show_state: true
      - type: button
        name: Open the picture archive
        icon: mdi:folder-image
        # Home Assistant's media browser lists the archive folder with a thumbnail
        # and the file name (the date and time) of each picture.
        tap_action:
          action: navigate
          navigation_path: /media-browser/browser/app%2Cmedia-source%3A%2F%2Fmedia_source%2Ffront_door
      - type: logbook
        title: Motion, last 7 days
        hours_to_show: 168
        entities:
          - binary_sensor.front_door_camera_motion
  - title: Gallery
    path: gallery
    icon: mdi:image-multiple
    # A panel view gives the card the whole width of the phone.
    panel: true
    cards:
      - type: custom:front-door-events-card
        page_size: 30
        # One entry per kind of event, each a media folder of snapshots named
        # YYYY-MM-DD_HH-MM-SS.jpg; the label is shown under each picture.
        sources:
          - label: Motion
            icon: mdi:motion-sensor
            media_content_id: media-source://media_source/front_door
  - title: Live
    path: live
    icon: mdi:cctv
    cards:
      # The buttons come first so that they stay where they are when the picture
      # appears and a second tap on Start lands on the same spot.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.front_door_camera_online
            state: "on"
        card:
          type: horizontal-stack
          cards:
            # Start sends ON again while the view runs, which renews its 30 seconds.
            - type: button
              name: Start
              icon: mdi:play
              show_state: false
              tap_action:
                action: perform-action
                perform_action: switch.turn_on
                target:
                  entity_id: switch.front_door_live_view
            - type: button
              name: Stop
              icon: mdi:stop
              show_state: false
              tap_action:
                action: perform-action
                perform_action: switch.turn_off
                target:
                  entity_id: switch.front_door_live_view
      # One of the next three cards shows at a time. The picture exists only while
      # the camera reports the view as on, so the card never shows a frame from an
      # earlier view as if it were live, and nothing is fetched while it is off.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.front_door_camera_online
            state: "off"
        card:
          type: markdown
          content: >-
            **The camera is offline.** Live view returns by itself when the camera
            reconnects to the broker.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.front_door_camera_online
            state: "on"
          - condition: state
            entity: switch.front_door_live_view
            state: "on"
        card:
          type: picture-entity
          entity: image.front_door_live
          show_name: false
          show_state: false
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.front_door_camera_online
            state: "on"
          - condition: state
            entity: switch.front_door_live_view
            state: "off"
        card:
          type: markdown
          content: Live view is off. Tap **Start** to watch the door.
      - type: markdown
        content: >-
          The view stops by itself after about 30 seconds; tap **Start** again to
          keep watching.
