apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

resources:
  - service-account.yaml
  - pvc.yaml
  - configmap.yaml
  - certificate.yaml
  - backend-tls-policy.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# One ConfigMap per directory of config/, which mirrors the layout of /config. The names
# get a content hash, so a change to any of them rolls the pod. A new file in one of
# these directories must be listed here.
generatorOptions:
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: homelab

configMapGenerator:
  - name: home-assistant-packages
    files:
      - config/packages/front_door.yaml
  - name: home-assistant-dashboards
    files:
      - config/dashboards/front-door.yaml
  - name: home-assistant-www-front-door
    files:
      - config/www/front-door/front-door-events-card.js

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
