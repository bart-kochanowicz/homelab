apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-assistant

resources:
  - service-account.yaml
  - pvc.yaml
  - configmap.yaml
  - certificate.yaml
  - backend-tls-policy.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
