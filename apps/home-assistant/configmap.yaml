apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: homelab
data:
  configuration.yaml: |
    default_config:

    homeassistant:
      internal_url: https://ha.thecavespace.net
      external_url: https://ha.thecavespace.net

    # Imported once: confirm HTTP server settings in HA on first startup.
    http:
      ssl_certificate: /etc/home-assistant/tls/tls.crt
      ssl_key: /etc/home-assistant/tls/tls.key
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/16  # Pod network CIDR
        - 127.0.0.1
        - ::1

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  automations.yaml: '[]'
  scripts.yaml: '{}'
  scenes.yaml: '[]'
