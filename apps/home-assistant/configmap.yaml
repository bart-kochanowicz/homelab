apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: homelab
data:
  configuration.yaml: |
    default_config:

    homeassistant:
      internal_url: https://ha.thecavespace.net
      external_url: https://ha.thecavespace.net
      # Motion snapshots are browsed under Media, which requires a login; never place
      # them in /config/www, whose /local URL is served without authentication. The
      # directory must exist at startup (the init container creates it); setting
      # media_dirs also drops the default `local` entry, and each directory is added
      # to allowlist_external_dirs automatically.
      media_dirs:
        front_door: /config/media/front-door
      # Everything else, such as the camera, its automations and its panel, is
      # content in apps/home-assistant/config/, mounted here one file per package.
      packages: !include_dir_named packages

    # Imported once: confirm HTTP server settings in HA on first startup.
    http:
      ssl_certificate: /etc/home-assistant/tls/tls.crt
      ssl_key: /etc/home-assistant/tls/tls.key
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.244.0.0/16  # Pod network CIDR
        - 127.0.0.1
        - ::1

    automation ui: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  automations.yaml: '[]'
  scripts.yaml: '{}'
  scenes.yaml: '[]'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: person-detector-config
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: homelab
data:
  # Two detectors. "fast" (the bundled SSD MobileNet, about 15 ms) answers first; only
  # a person it is sure of (60 % or more) is taken from it. Everything else goes to
  # "person" (Faster R-CNN, about 1 s per picture on the worker), which is more
  # accurate on a wide lens and infrared night pictures. On 80 snapshots of the camera
  # (2026-11-23) the fast one at 60 % reported 8 of the 24 people Faster R-CNN found
  # and nothing that it did not. Restart the pod after changing this file.
  doods.yaml: |
    server:
      host: 127.0.0.1
      port: 8089
      metrics: false
    logger:
      level: info
    doods:
      detectors:
        - name: fast
          type: tflite
          modelFile: models/coco_ssd_mobilenet_v1_1.0_quant.tflite
          labelFile: models/coco_labels0.txt
          numThreads: 2
        - name: person
          type: tensorflow
          modelFile: models/faster_rcnn_inception_v2_coco_2018_01_28.pb
          labelFile: models/coco_labels1.txt
          numThreads: 2
