apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  annotations:
    secret.reloader.stakater.com/reload: n8n-backend-tls
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
      annotations:
        homelab.security/automount-reviewed: "true"
    spec:
      serviceAccountName: n8n
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:2.45.7@sha256:9a8d8dcea75667496695d7810d7e1fe018a65efb36cc499d347f3931b3957b5d
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - name: https
          containerPort: 5678
          protocol: TCP
        env:
        - name: TZ
          value: "Europe/Warsaw"
        - name: GENERIC_TIMEZONE
          value: "Europe/Warsaw"
        - name: N8N_PROTOCOL
          value: "https"
        - name: N8N_SSL_CERT
          value: /etc/n8n/tls/tls.crt
        - name: N8N_SSL_KEY
          value: /etc/n8n/tls/tls.key
        - name: N8N_HOST
          value: "n8n.thecavespace.net"
        - name: N8N_PORT
          value: "5678"
        - name: N8N_EDITOR_BASE_URL
          value: "https://n8n.thecavespace.net"
        - name: WEBHOOK_URL
          value: "https://n8n-webhook.thecavespace.net/"
        - name: N8N_PROXY_HOPS
          value: "1"
        - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
          value: "true"
        - name: N8N_RUNNERS_ENABLED
          value: "true"
        - name: QUEUE_HEALTH_CHECK_ACTIVE
          value: "true"
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: N8N_ENCRYPTION_KEY
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /home/node/.cache
        - name: backend-tls
          mountPath: /etc/n8n/tls
          readOnly: true
        startupProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1000m
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-data-nvme
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: cache
        emptyDir:
          sizeLimit: 256Mi
      - name: backend-tls
        secret:
          secretName: n8n-backend-tls
          defaultMode: 0440
