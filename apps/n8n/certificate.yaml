apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-backend
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: homelab
spec:
  secretName: n8n-backend-tls
  secretTemplate:
    labels:
      homelab/reload: n8n-tls
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - n8n.thecavespace.net
  renewBeforePercentage: 33
  revisionHistoryLimit: 2
  usages:
    - digital signature
    - server auth
