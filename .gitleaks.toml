[extend]
useDefault = true

[[allowlists]]
description = "SealedSecret ciphertext and the encryption placeholder are safe to publish"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = [
  '''(?m)^    [A-Za-z0-9_.-]+: Ag[A-Za-z0-9+/]{600,}={0,2}[ \t]*$''',
  '''(?m)^    N8N_ENCRYPTION_KEY: REPLACE_WITH_KUBESEAL_ENCRYPTED_N8N_ENCRYPTION_KEY[ \t]*$''',
]
paths = [
  '''^apps/n8n/sealed-secret\.yaml$''',
  # Full-history scans include this removed manifest's ciphertext.
  '''^system/cloudflared/sealed-cloudflared-token\.yaml$''',
  '''^system/cert-manager-ca/sealed-root-ca\.yaml$''',
  '''^system/cert-manager-acme/sealed-cloudflare-token\.yaml$''',
  # Historical ciphertext for a repository credential that was never registered.
  '''^system/argocd/homelab-config-repository\.yaml$''',
  '''^system/argocd/argocd-sso-sealed-secret\.yaml$''',
  '''^system/monitoring/grafana-admin-sealed-secret\.yaml$''',
  '''^system/monitoring/alertmanager-email-sealed-secret\.yaml$''',
  '''^system/backups/crafty-controller-sealed-secret\.yaml$''',
  '''^system/backups/home-assistant-sealed-secret\.yaml$''',
  '''^system/backups/n8n-sealed-secret\.yaml$''',
  '''^system/backups/monitoring-sealed-secret\.yaml$''',
]
