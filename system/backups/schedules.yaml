apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: application-backup
  namespace: home-assistant
spec:
  backend:
    rest:
      url: https://10.0.70.10:8444/home-assistant/
      userSecretRef:
        name: k8up-repo
        key: username
      passwordSecretReg:
        name: k8up-repo
        key: http-password
    repoPasswordSecretRef:
      name: k8up-repo
      key: repo-password
    tlsOptions:
      caCert: /etc/restic-ca/ca.crt
    volumeMounts:
    - name: repo-ca
      mountPath: /etc/restic-ca
      readOnly: true
  podConfigRef:
    name: backup-job
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  backup:
    schedule: 0 3 * * *
    concurrentRunsAllowed: false
    activeDeadlineSeconds: 1200
    volumes:
    - name: repo-ca
      configMap:
        name: houston-backup-ca
    tags:
    - homelab
    labelSelectors:
    - matchLabels:
        app.kubernetes.io/part-of: homelab-backup
  check:
    schedule: 0 4 * * 0
    activeDeadlineSeconds: 1800
    volumes:
    - name: repo-ca
      configMap:
        name: houston-backup-ca
    podConfigRef:
      name: backup-check
  prune:
    schedule: 0 5 * * 0
    activeDeadlineSeconds: 1800
    volumes:
    - name: repo-ca
      configMap:
        name: houston-backup-ca
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 3
      hostnames:
      - home-assistant
      tags:
      - homelab
