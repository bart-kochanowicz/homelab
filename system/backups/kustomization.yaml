apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prebackup-pods.yaml
  - pod-configs.yaml
  - schedules.yaml
  - network-policies.yaml
  - home-assistant-sealed-secret.yaml
  - n8n-sealed-secret.yaml
  - monitoring-sealed-secret.yaml
configMapGenerator:
  - name: houston-backup-ca
    namespace: home-assistant
    files: [ca.crt]
  - name: houston-backup-ca
    namespace: n8n
    files: [ca.crt]
  - name: houston-backup-ca
    namespace: monitoring
    files: [ca.crt]
generatorOptions:
  disableNameSuffixHash: true
