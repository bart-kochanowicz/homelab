apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-reader
  namespace: home-assistant
automountServiceAccountToken: false
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: application-backup
  namespace: home-assistant
  labels:
    app.kubernetes.io/part-of: homelab-backup
spec:
  backupCommand: cat /staging/application.tar
  fileExtension: .tar
  pod:
    spec:
      serviceAccountName: backup-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare
        image: docker.io/keinos/sqlite3:3.53.4@sha256:6addaf450aea7e098e7d6f059d43501c317ec70494c1ace3cc94bfe1631cbfa5
        command:
        - /bin/sh
        - -ec
        args:
        - |
          tar -C /data --exclude='./home-assistant_v2.db' --exclude='./home-assistant_v2.db-*' --exclude='./home-assistant.log*' -cf /staging/files.tar .
          sqlite3 -readonly -bail -cmd '.timeout 60000' /data/home-assistant_v2.db '.backup /staging/home-assistant_v2.db'
          tar -C /staging -cf /staging/application.tar files.tar home-assistant_v2.db
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: '1'
            memory: 128Mi
            ephemeral-storage: 4Gi
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: staging
          mountPath: /staging
      containers:
      - name: archive
        image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
        command:
        - sleep
        - '2147483647'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 250m
            memory: 32Mi
        readinessProbe:
          exec:
            command:
            - test
            - -s
            - /staging/application.tar
          periodSeconds: 5
        volumeMounts:
        - name: staging
          mountPath: /staging
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: home-assistant-config
          readOnly: true
      - name: staging
        emptyDir:
          sizeLimit: 4Gi
---
