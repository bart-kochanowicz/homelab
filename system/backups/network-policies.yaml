apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-reader-isolation
  namespace: home-assistant
spec:
  podSelector:
    matchLabels:
      k8up.io/preBackupPod: application-backup
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-job
  namespace: home-assistant
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backup-job
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
  - toCIDR:
    - 10.0.70.10/32
    toPorts:
    - ports:
      - port: '8444'
        protocol: TCP
---
