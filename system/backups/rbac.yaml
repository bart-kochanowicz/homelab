apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: houston-backup
  namespace: home-assistant
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["pvc-backup"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["home-assistant-config"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["home-assistant"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["home-assistant"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: houston-backup
  namespace: home-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: houston-backup
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: houston-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: houston-backup
  namespace: n8n
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["pvc-backup"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["n8n-data"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["n8n"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["n8n"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: houston-backup
  namespace: n8n
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: houston-backup
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: houston-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: houston-backup
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["pvc-backup"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    resourceNames: ["kube-prometheus-stack-grafana"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kube-prometheus-stack-grafana"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["kube-prometheus-stack-grafana"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames:
      - houston-pvc-backup-success
      - houston-pvc-backup-failure
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: houston-backup
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: houston-backup
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: houston-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: houston-backup
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames:
      - home-assistant
      - n8n
      - monitoring
      - backups
    verbs: ["get"]
  - apiGroups: ["argoproj.io"]
    resources: ["appprojects"]
    resourceNames:
      - applications
      - platform
      - backups
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: houston-backup
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: houston-backup
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: houston-backup
