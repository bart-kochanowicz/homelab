{{- range $app := .Values.applications }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-reader
  namespace: {{ $app.namespace }}
automountServiceAccountToken: false
---
apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: application-backup
  namespace: {{ $app.namespace }}
  labels:
    app.kubernetes.io/part-of: homelab-backup
spec:
  backupCommand: cat /staging/application.tar
  fileExtension: .tar
  pod:
    spec:
      serviceAccountName: backup-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: {{ ne (int $app.uid) 0 }}
        runAsUser: {{ $app.uid }}
        runAsGroup: {{ $app.gid }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare
        image: {{ $.Values.images.sqlite }}
        command:
        - /bin/sh
        - -ec
        args:
        - |
          tar -C /data --exclude='./{{ $app.database }}' --exclude='./{{ $app.database }}-*'{{ if $app.excludeLog }} --exclude='./{{ $app.excludeLog }}'{{ end }} -cf /staging/files.tar .
          sqlite3 -readonly -bail -cmd '.timeout 60000' /data/{{ $app.database }} '.backup /staging/{{ $app.database }}'
          tar -C /staging -cf /staging/application.tar files.tar {{ $app.database }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: '1'
            memory: 128Mi
            ephemeral-storage: 4Gi
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: staging
          mountPath: /staging
      containers:
      - name: archive
        image: {{ $.Values.images.archive }}
        command:
        - sleep
        - '2147483647'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 250m
            memory: 32Mi
        readinessProbe:
          exec:
            command:
            - test
            - -s
            - /staging/application.tar
          periodSeconds: 5
        volumeMounts:
        - name: staging
          mountPath: /staging
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ $app.pvc }}
          readOnly: true
      - name: staging
        emptyDir:
          sizeLimit: 4Gi
{{- range $name := list "backup-job" "backup-check" }}
---
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: {{ $name }}
  namespace: {{ $app.namespace }}
  labels:
    app.kubernetes.io/name: backup-job
  annotations:
    homelab.security/automount-reviewed: 'true'
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: restic
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
{{- if eq $name "backup-check" }}
      initContainers:
      - name: read-data
        image: {{ $.Values.images.k8up }}
        command:
        - /usr/local/bin/restic
        args:
        - --cacert
        - /etc/restic-ca/ca.crt
        - check
        - --read-data
        env:
        - name: RESTIC_REPOSITORY
          value: rest:https://10.0.70.10:8444/{{ $app.namespace }}/
        - name: RESTIC_REST_USERNAME
          valueFrom:
            secretKeyRef:
              name: k8up-repo
              key: username
        - name: RESTIC_REST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: k8up-repo
              key: http-password
        - name: RESTIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: k8up-repo
              key: repo-password
        - name: RESTIC_CACHE_DIR
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: repo-ca
          mountPath: /etc/restic-ca
          readOnly: true
        - name: check-cache
          mountPath: /tmp
      volumes:
      - name: check-cache
        emptyDir:
          sizeLimit: 1Gi
{{- end }}
{{- end }}
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: application-backup
  namespace: {{ $app.namespace }}
spec:
  backend:
    rest:
      url: https://10.0.70.10:8444/{{ $app.namespace }}/
      userSecretRef:
        name: k8up-repo
        key: username
      passwordSecretReg:
        name: k8up-repo
        key: http-password
    repoPasswordSecretRef:
      name: k8up-repo
      key: repo-password
    tlsOptions:
      caCert: /etc/restic-ca/ca.crt
    volumeMounts:
    - name: repo-ca
      mountPath: /etc/restic-ca
      readOnly: true
  podConfigRef:
    name: backup-job
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  resourceRequirementsTemplate: {}
  backup:
    schedule: 0 3 * * *
    resources: {}
    activeDeadlineSeconds: 1200
    volumes:
    - name: repo-ca
      configMap:
        name: houston-backup-ca
    tags:
    - homelab
    labelSelectors:
    - matchLabels:
        app.kubernetes.io/part-of: homelab-backup
  check:
    schedule: 0 4 * * 0
    resources: {}
    activeDeadlineSeconds: 1800
    volumes:
    - name: repo-ca
      configMap:
        name: houston-backup-ca
    podConfigRef:
      name: backup-check
  prune:
    schedule: 0 5 * * 0
    resources: {}
    activeDeadlineSeconds: 1800
    volumes:
    - name: repo-ca
      configMap:
        name: houston-backup-ca
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 3
      hostnames:
      - {{ $app.namespace }}
      tags:
      - homelab
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-reader-isolation
  namespace: {{ $app.namespace }}
spec:
  podSelector:
    matchLabels:
      k8up.io/preBackupPod: application-backup
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-job
  namespace: {{ $app.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backup-job
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
  - toCIDR:
    - 10.0.70.10/32
    toPorts:
    - ports:
      - port: '8444'
        protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: houston-backup-ca
  namespace: {{ $app.namespace }}
data:
  ca.crt: |
{{ $.Files.Get "ca.crt" | indent 4 }}
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-operator
  namespace: backup-system
spec:
  endpointSelector: {}
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
{{- range $path, $_ := .Files.Glob "*-sealed-secret.yaml" }}
---
{{ $.Files.Get $path }}
{{- end }}
