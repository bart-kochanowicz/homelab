apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: backup-job
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: backup-job
  annotations:
    homelab.security/automount-reviewed: 'true'
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: restic
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
---
