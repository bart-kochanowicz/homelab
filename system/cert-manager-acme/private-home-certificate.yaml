apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: private-home-wildcard
  namespace: private-home
  labels:
    app.kubernetes.io/name: private-home
    app.kubernetes.io/part-of: homelab
spec:
  secretName: private-home-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "*.thecavespace.net"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBeforePercentage: 33
  revisionHistoryLimit: 2
  usages:
    - digital signature
    - server auth
