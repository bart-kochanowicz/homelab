cilium:
  upgradeCompatibility: "1.19"

  ipam:
    mode: kubernetes

  rollOutCiliumPods: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  kubeProxyReplacement: true
  gatewayAPI:
    enabled: true
    gatewayClass:
      create: false
    hostNetwork:
      enabled: false
    externalTrafficPolicy: Cluster
    enableAlpn: true
    xffNumTrustedHops: 0
  l2announcements:
    enabled: true
    leaseDuration: 15s
    leaseRenewDeadline: 5s
    leaseRetryPeriod: 2s
  k8sClientRateLimit:
    # Two leases / 5 seconds = 0.4 QPS; retain room for other API traffic.
    qps: 10
    burst: 20
  k8sServiceHost: localhost
  k8sServicePort: 7445

  bpf:
    hostLegacyRouting: true
    lbSourceRangeAllTypes: true

  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  policyEnforcementMode: default
  hostFirewall:
    enabled: true

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false

  operator:
    replicas: 1
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false

  hubble:
    enabled: true
    metrics:
      enabled:
        - dns:query;ignoreAAAA
        - drop
        - tcp
        - flow
        - icmp
        - http
      serviceMonitor:
        enabled: false
    relay:
      enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: false
    ui:
      enabled: false
