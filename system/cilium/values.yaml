cilium:
  ipam:
    mode: kubernetes

  kubeProxyReplacement: false
  k8sServiceHost: localhost
  k8sServicePort: 7445

  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  policyEnforcementMode: never
  hostFirewall:
    enabled: true

  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false

  operator:
    replicas: 1
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: false

  hubble:
    enabled: true
    metrics:
      enabled:
        - dns:query;ignoreAAAA
        - drop
        - tcp
        - flow
        - icmp
        - http
      serviceMonitor:
        enabled: false
    relay:
      enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: false
    ui:
      enabled: false
