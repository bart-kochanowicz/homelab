reloader:
  fullnameOverride: n8n-reloader
  image:
    tag: v1.4.23@sha256:82c80a15fdba22f738642553159f9fb37baf9e4d1edfeb798e8c48d87767f410
  reloader:
    watchGlobally: false
    ignoreConfigMaps: true
    ignoreJobs: true
    ignoreCronJobs: true
    resourceLabelSelector: homelab/reload=n8n-tls
    reloadOnCreate: true
    syncAfterRestart: true
    # The stable hash avoids another n8n restart when only Reloader restarts.
    reloadStrategy: env-vars
    readOnlyRootFileSystem: true
    rbac:
      enabled: false
    deployment:
      automountServiceAccountToken: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
