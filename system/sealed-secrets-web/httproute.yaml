apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sealed-secrets-web
  namespace: sealed-secrets
spec:
  parentRefs:
    - name: private-admin
      namespace: private-admin
      sectionName: sealed-secrets
  hostnames:
    - sealed-secrets.thecavespace.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sealed-secrets-web
          port: 8443
