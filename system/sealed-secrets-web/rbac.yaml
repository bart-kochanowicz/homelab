apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-web
  namespace: sealed-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sealed-secrets-web
  namespace: sealed-secrets
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["sealed-secrets-controller"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["sealed-secrets-controller", "http:sealed-secrets-controller:http"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-web
  namespace: sealed-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sealed-secrets-web
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-web
    namespace: sealed-secrets
