apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  config.json: |-
    {
      "nodePathMap": [],
      "storageClassConfigs": {
        "local-path": {
          "nodePathMap": [
            {
              "node": "talos-2jn-7he",
              "paths": ["/var/mnt/minecraft"]
            },
            {
              "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
              "paths": []
            }
          ]
        },
        "local-path-nvme": {
          "nodePathMap": [
            {
              "node": "talos-2jn-7he",
              "paths": ["/var/mnt/nvme"]
            },
            {
              "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
              "paths": []
            }
          ]
        }
      }
    }
  setup: |-
    #!/bin/sh
    set -eu
    case "$VOL_DIR" in
      /var/mnt/minecraft/crafty-controller/crafty-data/*|\
      /var/mnt/minecraft/pvc-*_crafty-controller_crafty-data)
        ;;
      /var/mnt/minecraft|/var/mnt/minecraft/*)
        echo "SATA storage is reserved for Crafty backups" >&2
        exit 1
        ;;
    esac
    mkdir -m 0770 -p "$VOL_DIR"
    case "$VOL_DIR" in
      */n8n/n8n-data/*|*_n8n_n8n-data|*/n8n/n8n-data-nvme/*|*_n8n_n8n-data-nvme)
        chown 1000:1000 "$VOL_DIR"
        ;;
      */monitoring/kube-prometheus-stack-grafana/*|*_monitoring_kube-prometheus-stack-grafana|\
      */monitoring/grafana-data-nvme/*|*_monitoring_grafana-data-nvme)
        chown 472:472 "$VOL_DIR"
        ;;
      */monitoring/prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0/*|\
      *_monitoring_prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0|\
      */monitoring/alertmanager-kube-prometheus-stack-alertmanager-db-alertmanager-kube-prometheus-stack-alertmanager-0/*|\
      *_monitoring_alertmanager-kube-prometheus-stack-alertmanager-db-alertmanager-kube-prometheus-stack-alertmanager-0|\
      */monitoring/prometheus-data-nvme-*/*|*_monitoring_prometheus-data-nvme-*|\
      */monitoring/alertmanager-data-nvme-*/*|*_monitoring_alertmanager-data-nvme-*)
        chown 1000:2000 "$VOL_DIR"
        ;;
      */crafty-controller/*|*_crafty-controller_*)
        chown 1000:0 "$VOL_DIR"
        ;;
      *)
        chown 0:0 "$VOL_DIR"
        ;;
    esac
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
        imagePullPolicy: IfNotPresent
