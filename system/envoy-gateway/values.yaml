gateway-helm:
  nameOverride: envoy-gateway
  fullnameOverride: envoy-gateway
  crds:
    enabled: false
  topologyInjector:
    enabled: false
  global:
    images:
      envoyGateway:
        image: docker.io/envoyproxy/gateway:v1.9.3@sha256:192fc9bdadb6d2462e8cf7bd702ce3dd9648f3310c6038787448a1f509b7cd9f
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            type: GatewayNamespace
          watch:
            type: Namespaces
            namespaces:
              - envoy-gateway-system
              - private-home
              - private-admin
              - home-assistant
              - crafty-controller
              - argocd
              - n8n
              - monitoring
      runtimeFlags:
        disabled:
          - EnvoyProxyPatch
  deployment:
    pod:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    envoyGateway:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
  certgen:
    job:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
