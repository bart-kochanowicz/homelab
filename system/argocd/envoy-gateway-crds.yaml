apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-crds
  namespace: argocd
spec:
  project: gateway-api-crds
  source:
    repoURL: https://github.com/bart-kochanowicz/homelab.git
    targetRevision: main
    path: system/envoy-gateway-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - FailOnSharedResource=true
