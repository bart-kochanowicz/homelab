apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateways
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/bart-kochanowicz/homelab.git
    targetRevision: main
    path: system/gateways
  destination:
    server: https://kubernetes.default.svc
    namespace: private-home
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
