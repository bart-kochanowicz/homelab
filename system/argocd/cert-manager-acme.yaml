apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-acme
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: git@github.com:bart-kochanowicz/homelab-config.git
    targetRevision: main
    path: cert-manager-acme
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
