apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant-reloader
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/bart-kochanowicz/homelab.git
    targetRevision: main
    path: system/home-assistant-reloader
    helm:
      releaseName: home-assistant-reloader
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
