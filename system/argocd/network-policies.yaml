apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    homelab.security/staged: "Enable only after 24-48 hours of Hubble review"
spec:
  project: platform
  source:
    repoURL: https://github.com/bart-kochanowicz/homelab.git
    targetRevision: main
    path: system/network-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
