apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: applications
  namespace: argocd
spec:
  description: Namespace-scoped homelab applications
  sourceRepos:
    - https://github.com/bart-kochanowicz/homelab.git
  destinations:
    - namespace: crafty-controller
      server: https://kubernetes.default.svc
    - namespace: home-assistant
      server: https://kubernetes.default.svc
    - namespace: n8n
      server: https://kubernetes.default.svc
  clusterResourceBlacklist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: bitnami.com
      kind: SealedSecret
    - group: cert-manager.io
      kind: Certificate
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: BackendTLSPolicy
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Explicitly scoped cluster platform components
  sourceRepos:
    - https://github.com/bart-kochanowicz/homelab.git
  destinations:
    - namespace: backup-system
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: local-path-storage
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: crafty-controller
      server: https://kubernetes.default.svc
    - namespace: home-assistant
      server: https://kubernetes.default.svc
    - namespace: n8n
      server: https://kubernetes.default.svc
    - namespace: sealed-secrets
      server: https://kubernetes.default.svc
    - namespace: private-home
      server: https://kubernetes.default.svc
    - namespace: private-admin
      server: https://kubernetes.default.svc
    - namespace: envoy-gateway-system
      server: https://kubernetes.default.svc
    - namespace: metallb-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy
    - group: gateway.networking.k8s.io
      kind: GatewayClass
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Endpoints
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
    - group: batch
      kind: CronJob
    - group: batch
      kind: Job
    - group: bitnami.com
      kind: SealedSecret
    - group: cert-manager.io
      kind: Certificate
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: ScrapeConfig
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: metallb.io
      kind: IPAddressPool
    - group: metallb.io
      kind: L2Advertisement
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
    - group: gateway.envoyproxy.io
      kind: ClientTrafficPolicy
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.networking.k8s.io
      kind: BackendTLSPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring-crds
  namespace: argocd
spec:
  description: Prometheus Operator CRDs from the pinned upstream chart
  sourceRepos:
    - https://github.com/prometheus-community/helm-charts.git
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  description: Separately managed networking CRDs
  sourceRepos:
    - https://github.com/bart-kochanowicz/homelab.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: backups
  namespace: argocd
spec:
  description: Application backup definitions
  sourceRepos:
    - https://github.com/bart-kochanowicz/homelab.git
  destinations:
    - namespace: crafty-controller
      server: https://kubernetes.default.svc
    - namespace: home-assistant
      server: https://kubernetes.default.svc
    - namespace: n8n
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: backup-system
      server: https://kubernetes.default.svc
  clusterResourceBlacklist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: ServiceAccount
    - group: bitnami.com
      kind: SealedSecret
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: k8up.io
      kind: Schedule
    - group: k8up.io
      kind: PreBackupPod
    - group: k8up.io
      kind: PodConfig
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: backup-crds
  namespace: argocd
spec:
  description: Pinned backup operator CRDs
  sourceRepos:
    - https://github.com/k8up-io/k8up.git
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
