apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-generator
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: &repoURL https://github.com/bart-kochanowicz/homelab.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        app.kubernetes.io/managed-by: apps-generator
        app.kubernetes.io/part-of: homelab
    spec:
      project: applications
      source:
        repoURL: *repoURL
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: home-assistant
          namespace: home-assistant
          jqPathExpressions:
            - >-
              .spec.template.spec.containers[] | select(.name == "home-assistant") |
              .env[]? | select(.name == "STAKATER_HOME_ASSISTANT_BACKEND_TLS_SECRET")
        - group: apps
          kind: Deployment
          name: n8n
          namespace: n8n
          jqPathExpressions:
            - >-
              .spec.template.spec.containers[] | select(.name == "n8n") |
              .env[]? | select(.name == "STAKATER_N8N_BACKEND_TLS_SECRET")
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - RespectIgnoreDifferences=true
      revisionHistoryLimit: 3
