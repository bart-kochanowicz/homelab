apiVersion: v1
kind: Service
metadata:
  name: argocd-gateway-grpc
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-gateway-grpc
    app.kubernetes.io/part-of: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
      # Select gRPC HTTP/2; BackendTLSPolicy secures the upstream connection.
      appProtocol: kubernetes.io/h2c
