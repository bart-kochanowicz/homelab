apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/bart-kochanowicz/homelab.git
    targetRevision: main
    path: system/metallb-config
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true
