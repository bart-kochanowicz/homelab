apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: crafty-controller
data:
  config.alloy: |
{{ .Files.Get "config.alloy" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-log-rules
  namespace: monitoring
data:
  minecraft.yaml: |
{{ .Files.Get "minecraft-rules.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: '1'
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        editable: false
        jsonData:
          maxLines: 1000
          manageAlerts: false
