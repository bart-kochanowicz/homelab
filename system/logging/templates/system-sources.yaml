apiVersion: v1
kind: Service
metadata:
  name: loki-houston
  namespace: monitoring
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http-metrics
      nodePort: 30514
---
apiVersion: v1
kind: Service
metadata:
  name: talos-logs
  namespace: crafty-controller
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: control-plane
      port: 1515
      targetPort: talos-control
      nodePort: 30515
    - name: worker
      port: 1516
      targetPort: talos-worker
      nodePort: 30516
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: alloy-houston
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  staticConfigs:
    - targets: ['10.0.70.10:12345']
      labels:
        namespace: monitoring
        service: alloy-houston
