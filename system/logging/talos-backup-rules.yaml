groups:
  - name: talos-backups
    interval: 5m
    rules:
      - alert: TalosEtcdBackupUnhealthy
        expr: |
          max by (node) ((
            max by (node) (max_over_time({node="houston-01",source="journal",service_name="talos-etcd-backup.service"}
              |= "TALOS_ETCD_BACKUP_RESULT=" != "TALOS_ETCD_BACKUP_RESULT=success"
              | label_format event_time="{{ __timestamp__ | unixEpochMillis }}" | unwrap event_time [14d]))
            > on(node)
            max by (node) (max_over_time({node="houston-01",source="journal",service_name="talos-etcd-backup.service"}
              |= "TALOS_ETCD_BACKUP_SUCCESS"
              | label_format event_time="{{ __timestamp__ | unixEpochMillis }}" | unwrap event_time [14d]))
          ) or (
            max by (node) (max_over_time({node="houston-01",source="journal",service_name="talos-etcd-backup.service"}
              |= "TALOS_ETCD_BACKUP_RESULT=" != "TALOS_ETCD_BACKUP_RESULT=success"
              | label_format event_time="{{ __timestamp__ | unixEpochMillis }}" | unwrap event_time [14d]))
            unless on(node)
            max by (node) (max_over_time({node="houston-01",source="journal",service_name="talos-etcd-backup.service"}
              |= "TALOS_ETCD_BACKUP_SUCCESS"
              | label_format event_time="{{ __timestamp__ | unixEpochMillis }}" | unwrap event_time [14d]))
          ) or absent_over_time({node="houston-01",source="journal",service_name="talos-etcd-backup.service"}
            |= "TALOS_ETCD_BACKUP_SUCCESS" [36h]))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Talos recovery backup needs attention
          description: A backup failed without a later verified success, or no success was recorded in 36 hours. Check talos-etcd-backup.service on Houston and the mounted SSD; preserve failed private staging.
      - alert: TalosBackupClientExpiring
        expr: sum(count_over_time({node="houston-01",source="journal",service_name="talos-etcd-backup.service"} |= "TALOS_ETCD_BACKUP_CLIENT_EXPIRING" [36h])) > 0
        labels:
          severity: warning
        annotations:
          summary: Renew the Talos backup client certificate
          description: The dedicated backup client expires within 30 days or cannot be parsed. Reissue its configuration and apply the talos_backup Ansible role before backups lose access.
