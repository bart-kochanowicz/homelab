apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: vault
  namespace: vault
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: vault
      sectionName: https
  validation:
    hostname: vault.vault.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: vault-backend-ca
