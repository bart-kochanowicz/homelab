apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  parentRefs:
    - name: private-admin
      namespace: private-admin
      sectionName: vault
  hostnames:
    - vault.thecavespace.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vault
          port: 8200
