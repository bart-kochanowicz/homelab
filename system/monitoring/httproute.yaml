apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: homelab
spec:
  parentRefs:
    - name: private-admin
      namespace: private-admin
      sectionName: grafana
  hostnames:
    - grafana.thecavespace.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 3000
      timeouts:
        request: 0s
