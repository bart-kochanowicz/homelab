grafana:
  enabled: true
  initChownData:
    enabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: false
  deploymentStrategy:
    type: Recreate
  # The chart's Helm test hardcodes HTTP on port 80.
  testFramework:
    enabled: false
  grafana.ini:
    server:
      protocol: https
      http_port: 3000
      domain: grafana.thecavespace.net
      root_url: https://grafana.thecavespace.net/
      cert_file: /etc/grafana/tls/tls.crt
      cert_key: /etc/grafana/tls/tls.key
      certs_watch_interval: 30s
    security:
      cookie_secure: true
  extraSecretMounts:
    - name: backend-tls
      secretName: grafana-backend-tls
      mountPath: /etc/grafana/tls
      defaultMode: 0440
      readOnly: true
  hostAliases:
    - ip: 127.0.0.1
      hostnames:
        - grafana-backend.thecavespace.net
  service:
    port: 3000
    portName: https
    appProtocol: https
  readinessProbe:
    httpGet:
      scheme: HTTPS
  livenessProbe:
    httpGet:
      scheme: HTTPS
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
        allowUiUpdates: false
      reloadURL: https://grafana-backend.thecavespace.net:3000/api/admin/provisioning/dashboards/reload
    datasources:
      reloadURL: https://grafana-backend.thecavespace.net:3000/api/admin/provisioning/datasources/reload
  serviceMonitor:
    labels:
      release: kube-prometheus-stack
    scheme: https
    tlsConfig:
      serverName: grafana-backend.thecavespace.net
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m

alertmanager:
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-email
    # Notification history must outlive the seven-day delivery check interval.
    retention: 240h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: [k8up.io]
        resources: [backups]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: k8up.io
              version: v1
              kind: Backup
            metricNamePrefix: k8up_backup
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
            metrics:
              - name: created_timestamp_seconds
                help: Creation time of a K8up backup request.
                each:
                  type: Gauge
                  gauge:
                    path: [metadata, creationTimestamp]
              - name: condition_transition_time_seconds
                help: Transition time of a K8up backup condition.
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath:
                      type: [type]
                      status: [status]
                      reason: [reason]
                    valueFrom: [lastTransitionTime]

kubeProxy:
  enabled: false

# Talos keeps these metrics on loopback; readiness is checked through kube-state-metrics.
# This cluster uses node-local volumes and does not provide N+1 workload failover.
defaultRules:
  rules:
    kubeSchedulerAlerting: false
    kubeControllerManager: false
  disabled:
    KubeCPUOvercommit: true
    KubeMemoryOvercommit: true

prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: false

crds:
  enabled: false
