apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-security-and-operations
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.nodes
      rules:
        - record: homelab:node_info
          expr: |
            max by (node, node_name) (
              label_replace(
                kube_node_labels{label_homelab_thecavespace_net_name!=""},
                "node_name", "$1", "label_homelab_thecavespace_net_name", "(.+)"
              )
            )
            or on (node)
            label_replace(max by (node) (kube_node_info), "node_name", "$1", "node", "(.+)")
        - record: homelab:node_exporter_info
          expr: |
            max by (instance, node, node_name) (
              label_replace(node_uname_info{job="node-exporter"}, "node", "$1", "nodename", "(.+)")
              * on (node) group_left (node_name) homelab:node_info
            )
            or on (instance)
            max by (instance, node_name) (
              label_replace(node_uname_info{job="node-exporter"}, "node_name", "$1", "nodename", "(.+)")
            )
    - name: homelab.platform
      rules:
        - alert: CiliumAgentUnavailable
          expr: kube_daemonset_status_number_unavailable{namespace="kube-system",daemonset="cilium"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: One or more Cilium agents are unavailable
        - alert: CiliumEndpointNotReady
          expr: sum(cilium_endpoint_state{endpoint_state!="ready"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Cilium has endpoints that are not ready
        - alert: CiliumMetricsMissing
          expr: |
            sum(up{job="cilium-agent"})
              < scalar(kube_daemonset_status_desired_number_scheduled{namespace="kube-system",daemonset="cilium"})
            or absent(up{job="cilium-agent"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Cilium metrics are missing from one or more agents
            description: Check the cilium-agent PodMonitor and Prometheus targets before trusting network alerts.
        - alert: CiliumUnmanagedEndpoints
          expr: cilium_operator_unmanaged_pods > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Cilium has detected unmanaged pods
            description: Inspect the operator's unmanaged pod list and CNI setup before restarting workloads.
        - alert: CiliumUnexpectedDrops
          expr: |
            sum by (reason) (
              rate(hubble_drop_total{
                reason!~"POLICY_DENIED|POLICY_DENY|DENIED_BY_LB_SRC_RANGE_CHECK|UNSUPPORTED_L2_PROTOCOL|UNSUPPORTED_L3_PROTOCOL"
              }[5m])
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Cilium is dropping over one packet per second for an unexpected reason
            description: 'Drop reason: {{ $labels.reason }}. Inspect Hubble flows and the Network dashboard; expected policy and unsupported-protocol drops are excluded.'
        - alert: TalosSchedulerUnavailable
          expr: |
            kube_node_role{role="control-plane"}
            unless on (node)
            max by (node) (
              kube_pod_info{namespace="kube-system",pod=~"kube-scheduler-.+"}
              and on (namespace, pod)
              (kube_pod_status_ready{namespace="kube-system",condition="true"} == 1)
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A control-plane node has no ready scheduler pod
            description: 'Check kube-scheduler on {{ with query (printf "homelab:node_info{node=%q}" $labels.node) }}{{ . | first | label "node_name" }}{{ else }}{{ $labels.node }}{{ end }} through Kubernetes and Talos. Pod readiness does not validate the loopback metrics endpoint.'
        - alert: TalosControllerManagerUnavailable
          expr: |
            kube_node_role{role="control-plane"}
            unless on (node)
            max by (node) (
              kube_pod_info{namespace="kube-system",pod=~"kube-controller-manager-.+"}
              and on (namespace, pod)
              (kube_pod_status_ready{namespace="kube-system",condition="true"} == 1)
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A control-plane node has no ready controller-manager pod
            description: 'Check kube-controller-manager on {{ with query (printf "homelab:node_info{node=%q}" $labels.node) }}{{ . | first | label "node_name" }}{{ else }}{{ $labels.node }}{{ end }} through Kubernetes and Talos. Pod readiness does not validate the loopback metrics endpoint.'
        - alert: NodeMemoryRequestsHigh
          expr: |
            sum by (node) (kube_pod_container_resource_requests{resource="memory",node!=""})
            / sum by (node) (kube_node_status_allocatable{resource="memory"}) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod memory requests exceed 90% of a node's allocatable memory
            description: 'Review memory requests and scheduling capacity on {{ with query (printf "homelab:node_info{node=%q}" $labels.node) }}{{ . | first | label "node_name" }}{{ else }}{{ $labels.node }}{{ end }}. This is reserved capacity, not measured memory use.'
        - alert: NodeCpuRequestsHigh
          expr: |
            sum by (node) (kube_pod_container_resource_requests{resource="cpu",node!=""})
            / sum by (node) (kube_node_status_allocatable{resource="cpu"}) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Pod CPU requests exceed 90% of a node's allocatable CPU
            description: 'Review CPU requests and scheduling capacity on {{ with query (printf "homelab:node_info{node=%q}" $labels.node) }}{{ . | first | label "node_name" }}{{ else }}{{ $labels.node }}{{ end }}. This is reserved capacity, not measured CPU use.'
        - alert: ArgoCDMetricsMissing
          expr: absent(up{job="argocd-application-controller"}) or max(up{job="argocd-application-controller"}) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: ArgoCD application metrics are unavailable
            description: Check the application-controller PodMonitor and Prometheus targets; application health alerts depend on this scrape.
        - alert: ArgoCDApplicationOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: An ArgoCD application is out of sync
            description: '{{ $labels.name }} has been {{ $labels.sync_status }} for 15 minutes. Check its diff before syncing manually managed applications.'
        - alert: ArgoCDApplicationUnhealthy
          expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: An ArgoCD application is unhealthy
            description: '{{ $labels.name }} has health status {{ $labels.health_status }}. Inspect its resources and events in ArgoCD.'
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 1209600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: A cert-manager certificate expires in less than 14 days
            description: 'Check renewal of {{ $labels.namespace }}/{{ $labels.name }} and its ACME challenges.'
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: A cert-manager certificate is not ready
            description: 'Inspect {{ $labels.namespace }}/{{ $labels.name }}, its CertificateRequest and DNS-01 challenges.'
    - name: homelab.backups
      rules:
        - record: homelab:backup_last_success_timestamp_seconds
          expr: |
            max by (namespace) (
              k8up_backup_condition_transition_time_seconds{
                namespace=~"home-assistant|n8n|monitoring|crafty-controller",
                type="Completed",status="True",reason="Succeeded"
              }
            )
        - record: homelab:backup_last_failure_timestamp_seconds
          expr: |
            max by (namespace) (
              k8up_backup_condition_transition_time_seconds{
                namespace=~"home-assistant|n8n|monitoring|crafty-controller",
                type="Completed",status="True",reason!="Succeeded"
              }
              or
              k8up_backup_condition_transition_time_seconds{
                namespace=~"home-assistant|n8n|monitoring|crafty-controller",
                type="PreBackupPodReady",status="False",
                reason!~"Waiting|Ready|NoPreBackupPodsFound|Finished|Succeeded"
              }
            )
        - alert: HoustonPvcBackupFailed
          expr: |
            (
              homelab:backup_last_failure_timestamp_seconds
              > on(namespace) homelab:backup_last_success_timestamp_seconds
            )
            or
            (
              homelab:backup_last_failure_timestamp_seconds
              unless on(namespace) homelab:backup_last_success_timestamp_seconds
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The latest Houston PVC backup failed
            description: 'Inspect K8up Backup resources in {{ $labels.namespace }}, including the PreBackupPod initialization.'
        - alert: HoustonPvcBackupMissing
          expr: |
            kube_namespace_created{namespace=~"home-assistant|n8n|monitoring|crafty-controller"}
            unless on(namespace) homelab:backup_last_success_timestamp_seconds
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: No successful Houston PVC backup has been recorded
            description: 'No completed K8up backup is available for {{ $labels.namespace }}.'
        - alert: HoustonPvcBackupStale
          expr: time() - homelab:backup_last_success_timestamp_seconds{namespace!="crafty-controller"} > 129600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The latest successful Houston PVC backup is over 36 hours old
            description: 'Check the daily K8up schedule and Backup resources in {{ $labels.namespace }}.'
        - alert: HoustonWeeklyPvcBackupStale
          expr: time() - homelab:backup_last_success_timestamp_seconds{namespace="crafty-controller"} > 691200
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The latest successful Crafty panel backup is over eight days old
            description: Check the Monday 03:00 K8up schedule and Backup resources in crafty-controller.
        - alert: HoustonPvcBackupStuck
          expr: |
            (
              time() - k8up_backup_created_timestamp_seconds{
                namespace=~"home-assistant|n8n|monitoring|crafty-controller"
              } > 1800
              unless on(namespace, name)
              k8up_backup_condition_transition_time_seconds{type="Completed",status="True"}
            )
            unless on(namespace, name)
            k8up_backup_condition_transition_time_seconds{
              type="PreBackupPodReady",status="False",
              reason!~"Waiting|Ready|NoPreBackupPodsFound|Finished|Succeeded"
            }
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A Houston PVC backup has not finished after 30 minutes
            description: 'Inspect K8up Backup {{ $labels.namespace }}/{{ $labels.name }} and its initialization pods.'
