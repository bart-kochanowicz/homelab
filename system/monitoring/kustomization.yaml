apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - grafana-pvc.yaml
  - certificate.yaml
  - backend-tls-policy.yaml
  - httproute.yaml
  - grafana-admin-sealed-secret.yaml
  - alertmanager-email-sealed-secret.yaml
  - cilium-monitors.yaml
  - argocd-pod-monitor.yaml
  - security-alerts.yaml

configMapGenerator:
  - name: homelab-dashboards
    files:
      - dashboards/overview.json
      - dashboards/resources.json
      - dashboards/network.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: /tmp/dashboards/Homelab

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 79.4.1
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: values.yaml
