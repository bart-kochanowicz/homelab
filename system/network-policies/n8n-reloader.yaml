apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: n8n-reloader
  namespace: n8n
spec:
  endpointSelector:
    matchLabels:
      app: n8n-reloader
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
