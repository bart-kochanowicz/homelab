apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: talos-worker-bootstrap
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  ingress:
    - fromCIDR:
        - 10.0.70.12/32
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "50001"
              protocol: TCP
