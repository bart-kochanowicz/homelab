apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vault
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-private-admin
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: private-admin
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: envoy-gateway
              app.kubernetes.io/component: proxy
              gateway.envoyproxy.io/owning-gateway-name: private-admin
      ports:
        - protocol: TCP
          port: 8200
