apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: private-home
spec:
  blocks:
    - start: 10.0.70.200
      stop: 10.0.70.200
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: private-home
      io.kubernetes.service.name: envoy-private-home
      gateway.envoyproxy.io/owning-gateway-name: private-home
      gateway.envoyproxy.io/owning-gateway-namespace: private-home
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: private-admin
spec:
  blocks:
    - start: 10.0.70.201
      stop: 10.0.70.201
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: private-admin
      io.kubernetes.service.name: envoy-private-admin
      gateway.envoyproxy.io/owning-gateway-name: private-admin
      gateway.envoyproxy.io/owning-gateway-namespace: private-admin
