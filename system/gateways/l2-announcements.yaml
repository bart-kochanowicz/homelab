apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: private-home
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: private-home
      io.kubernetes.service.name: cilium-gateway-private-home
      gateway.networking.k8s.io/gateway-name: private-home
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  interfaces:
    - ^eno1$
  externalIPs: false
  loadBalancerIPs: true
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: private-admin
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: private-admin
      io.kubernetes.service.name: cilium-gateway-private-admin
      gateway.networking.k8s.io/gateway-name: private-admin
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  interfaces:
    - ^eno1$
  externalIPs: false
  loadBalancerIPs: true
