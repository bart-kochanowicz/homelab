apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: private-home
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: private-home
    namespace: private-home
