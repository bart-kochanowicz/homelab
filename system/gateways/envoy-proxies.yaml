apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private-home
  namespace: private-home
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ipFamily: IPv4
  concurrency: 2
  mergeGateways: false
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: private-home
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.39.6@sha256:1cac8b3a2f72d5a0918f54d7b49e68aae0b0ba325c2d50c8a9a3fff7a4d1f994
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      envoyService:
        name: envoy-private-home
        type: LoadBalancer
        loadBalancerClass: metallb.io/metallb
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: Local
        annotations:
          metallb.io/address-pool: private-home
          metallb.io/loadBalancerIPs: 10.0.70.200
        loadBalancerSourceRanges:
          - 10.0.40.0/24
          - 10.0.80.0/24
          - 10.0.100.0/24
---
