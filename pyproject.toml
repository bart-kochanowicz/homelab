[project]
name = "homelab-checks"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pyright[nodejs]==1.1.414",
  "PyYAML>=6,<7",
  "ruff==0.17.3",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["tests"]
typeCheckingMode = "standard"
reportUnknownMemberType = "error"
